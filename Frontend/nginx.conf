# Served by nginx inside the frontend container.
# Copied to /etc/nginx/conf.d/default.conf — the nginx image includes
# every *.conf in /etc/nginx/conf.d/, so only the server block is needed.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS server (every container has one at 127.0.0.11).
    # Combined with the variable proxy_pass below, upstream hostnames are
    # resolved at REQUEST time, not at nginx startup — so a missing
    # "backend" host gives a per-request 502 instead of crashing nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Where the static build output lives (copied from the builder stage)
    root /usr/share/nginx/html;
    index index.html;
    
    # ---------------------------------------------------------
    # 1) SPA fallback — every unknown path serves index.html so
    #    React Router owns the URL. Without this, refreshing any
    #    client-side route (/debate/arguments etc.) gives a 404.
    # ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------
    # 2) API reverse proxy — forward /api/* to the backend container.
    #    "backend" is the docker-compose SERVICE NAME — it only
    #    resolves inside a shared Docker network (Step 5).
    #    Standalone run = 502 Bad Gateway (expected, see guide).
    # ---------------------------------------------------------
    location /api/ {
        # Variable forces request-time DNS resolution (see resolver above).
        # No URI part after the URL = original request URI passed unchanged.
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------------------------------------------------------
    # 3) Socket.IO proxy — WebSockets start as HTTP requests that
    #    say "Upgrade: websocket". nginx strips Upgrade by default
    #    and speaks HTTP/1.0 upstream, killing the handshake —
    #    the three lines below are the famous fix.
    # ---------------------------------------------------------
    location /socket.io/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
