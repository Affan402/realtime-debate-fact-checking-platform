name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build
        run: |
          cd Frontend
          npm run build
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci
      - name: Run Backend Tests
        run: |
          cd Backend
          npm test
        env:
          URI: ${{ secrets.MONGODB_URI }}

  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker BUildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push backend Docker Image
        run: |
          docker build \
            -t ghcr.io/affan402/debate-backend:latest \
            -t ghcr.io/affan402/debate-backend:${{ github.sha }} \
            ./Backend
          docker push ghcr.io/affan402/debate-backend:latest
          docker push ghcr.io/affan402/debate-backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        run: |
          docker build \
            -t ghcr.io/affan402/debate-frontend:latest \
            -t ghcr.io/affan402/debate-frontend:${{ github.sha }} \
            ./Frontend
          docker push ghcr.io/affan402/debate-frontend:latest
          docker push ghcr.io/affan402/debate-frontend:${{ github.sha }}