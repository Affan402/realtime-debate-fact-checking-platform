name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4 #copy code onto the runner

      - uses: actions/setup-node@v4 #install nodejs
        with:
          node-version: '22'

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: Frontend/node_modules
          key: frontend-deps-${{ hashFiles('Frontend/package-lock.json') }}
          
      - name: Install frontend dependencies
        run: |
          cd Frontend
          npm ci
      - name: Build frontend
        run: |
          cd Frontend
          npm run build
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: Backend/node_modules
          key: backend-deps-${{ hashFiles('Backend/package-lock.json') }}

      - name: Install backend dependencies
        run: |
          cd Backend
          npm ci

      - name: Run backend tests
        run: |
          cd Backend
          npm test
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build \
            -t ghcr.io/affan402/debate-backend:latest \
            -t ghcr.io/affan402/debate-backend:${{ github.sha }} \
            ./Backend
          docker push ghcr.io/affan402/debate-backend:latest
          docker push ghcr.io/affan402/debate-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build \
            -t ghcr.io/affan402/debate-frontend:latest \
            -t ghcr.io/affan402/debate-frontend:${{ github.sha }} \
            ./Frontend
          docker push ghcr.io/affan402/debate-frontend:latest
          docker push ghcr.io/affan402/debate-frontend:${{ github.sha }}