name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4 #copy code onto the runner

      - uses: actions/setup-node@v4 #install nodejs
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: |
          cd Frontend
          npm ci
      - name: Build frontend
        run: |
          cd Frontend
          npm run build
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: |
          cd Backend
          npm ci

      - name: Run backend tests
        run: |
          cd Backend
          npm test
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -t debate-backend:latest -t debate-backend:${{ github.sha }} ./Backend

      - name: Build frontend image
        run: |
          docker build -t debate-frontend:latest -t debate-frontend:${{ github.sha }} ./Frontend